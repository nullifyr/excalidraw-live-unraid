name: Packaging checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python3 tests/validate-template.py
      - run: node --test tests/mcp-client.test.mjs
